[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmmatrix"
version = "0.1.0"
description = "Synthetic-world benchmark for contamination-free LLM forecasting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
    "statsmodels",
    "pyarrow",
    "properscoring",
    "tiktoken",
    "httpx",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
